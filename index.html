<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밸런스 게임</title>
<style>
:root{--bg:#fff8ec;--fg:#2b2340;--card:#ffffff;--a:#ff7a59;--b:#4b8bff;--muted:#7a7390;--line:#eadfc9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1730;--fg:#f3efff;--card:#2a2446;--a:#ff8f73;--b:#78a5ff;--muted:#a69fc2;--line:#3d3560}}
:root[data-theme="dark"]{--bg:#1b1730;--fg:#f3efff;--card:#2a2446;--a:#ff8f73;--b:#78a5ff;--muted:#a69fc2;--line:#3d3560}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:24px 18px 40px;text-align:center}
h1{font-size:28px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.count{color:var(--muted);font-size:14px;margin-bottom:16px}
.choice{display:block;width:100%;border:3px solid transparent;border-radius:20px;padding:26px 18px;font-size:19px;font-weight:700;line-height:1.45;color:#fff;cursor:pointer;font-family:inherit;transition:transform .12s}
.choice:active{transform:scale(.97)}
.choice.a{background:var(--a)}.choice.b{background:var(--b)}
.vs{font-weight:900;font-size:20px;margin:12px 0;color:var(--muted)}
.start{background:var(--a);color:#fff;border:0;border-radius:99px;padding:16px 36px;font-size:20px;font-weight:800;cursor:pointer;font-family:inherit}
.res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;text-align:left}
.res small{color:var(--muted)}
.res b{display:block;margin-top:4px;font-size:17px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>⚖️ 밸런스 게임</h1>
  <p class="sub">둘 중 하나만 골라야 해!</p>

  <section id="home">
    <p>13개 질문 중 <b>5개</b>가 랜덤으로 나와요.</p>
    <button class="start" id="startBtn">시작하기</button>
  </section>

  <section id="play" class="hide">
    <div class="bar"><i id="fill"></i></div>
    <div class="count" id="count"></div>
    <button class="choice a" id="btnA"></button>
    <div class="vs">VS</div>
    <button class="choice b" id="btnB"></button>
  </section>

  <section id="end" class="hide">
    <h2>🎉 끝! 내 선택은?</h2>
    <div id="list"></div>
    <button class="start" id="again">다시 하기</button>
  </section>
</main>

<script>
const Q=[
["평생 친구 1명 만나기","넓고 얕은 인간관계로 친구 100명 만들기"],
["내 모든 비밀을 알고 있는 친구","내 Secret을 하나도 모르는 친구"],
["전교생이 다 좋아하는 친구 되기","선생님이 가장 신뢰하는 학생 되기"],
["짝꿍이 매일 맛있는 간식 나눔하기","짝꿍이 매일 숙제 도와주기"],
["소풍 갔는데 비 쏟아지기","체육대회 당일 몸살 나기"],
["모든 과목 시험 80점 받기","한 과목 100점 받고 나머지 과목 50점 받기"],
["중학교 입학 당일 반장 맡기","중학교 내내 조용히 존재감 없이 살기"],
["방학 숙제 방학 첫날 다 끝내기","방학 숙제 개학 전날 밤새서 끝내기"],
["세상의 모든 언어를 자유롭게 말하기","동물들과 대화할 수 있는 능력 갖기"],
["타임머신 타고 과거로 가기","미래로 가서 내 모습 보고 오기"],
["순간이동 능력(거리 제한 없음)","투명인간 능력(하루 1시간 제한)"],
["하루 동안 내 마음대로 세상 규칙 바꾸기","평생 원하는 옷·신발 공짜로 받기"],
["하루 동안 모든 사람의 속마음 듣기","하루 동안 내가 원하는 사람 마음 조종하기"]
];
const $=id=>document.getElementById(id);
let picks=[],answers=[],i=0;
function show(id){["home","play","end"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function start(){
  const a=Q.map((_,k)=>k);
  for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}
  picks=a.slice(0,5);answers=[];i=0;show("play");render();
}
function render(){
  const q=Q[picks[i]];
  $("count").textContent=(i+1)+" / 5";
  $("fill").style.width=(i/5*100)+"%";
  $("btnA").textContent="A. "+q[0];
  $("btnB").textContent="B. "+q[1];
}
function choose(c){
  answers.push(c);i++;
  if(i>=5){finish()}else{render()}
}
function finish(){
  $("fill").style.width="100%";
  const box=$("list");box.innerHTML="";
  picks.forEach((p,k)=>{
    const d=document.createElement("div");d.className="res";
    const s=document.createElement("small");s.textContent="문제 "+(k+1);
    const b=document.createElement("b");b.textContent=(answers[k]===0?"A. ":"B. ")+Q[p][answers[k]];
    d.append(s,b);box.append(d);
  });
  show("end");
}
$("startBtn").onclick=start;$("again").onclick=start;
$("btnA").onclick=()=>choose(0);$("btnB").onclick=()=>choose(1);
</script>
</body>
</html>
